name: Deploy website to gh-pages

on:
  push:
    branches:
      - main # Only runs when pushed to main

permissions:
  contents: write # The runner will be able to push the built site into the repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro website
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The build folder (astro)
          branch: gh-pages # Target branch for the static HTML
          clean: true # Automatically removes old assets no longer needed